name: Deploy to MonsterASP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy via WebDeploy (MSDeploy)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/Platform.Api/Platform.Api.csproj

      - name: Build Backend
        run: dotnet build backend/Platform.Api/Platform.Api.csproj --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test backend/Platform.UnitTests/Platform.UnitTests.csproj --configuration Release

      - name: Inject Production Secrets
        shell: pwsh
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          $path = "backend/Platform.Api/appsettings.Production.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.ConnectionStrings.DefaultConnection = $env:DB_CONNECTION_STRING
          if (-not $json.PSObject.Properties['Jwt']) {
            $json | Add-Member -NotePropertyName Jwt -NotePropertyValue ([pscustomobject]@{})
          }
          $json.Jwt | Add-Member -NotePropertyName Secret -NotePropertyValue $env:JWT_SECRET -Force
          if (-not $json.PSObject.Properties['Groq']) {
            $json | Add-Member -NotePropertyName Groq -NotePropertyValue ([pscustomobject]@{})
          }
          $json.Groq | Add-Member -NotePropertyName ApiKey -NotePropertyValue $env:GROQ_API_KEY -Force
          $json | ConvertTo-Json -Depth 10 | Set-Content $path

      - name: Publish to MonsterASP via WebDeploy
        shell: pwsh
        env:
          MONSTERASP_PASSWORD: ${{ secrets.MONSTERASP_PASSWORD }}
        run: |
          dotnet publish backend/Platform.Api/Platform.Api.csproj -c Release /p:PublishProfile=MonsterASP /p:Password="$env:MONSTERASP_PASSWORD" /p:EnableMsDeployAppOffline=True /p:AllowUntrustedCertificate=True /p:SkipExtraFilesOnServer=True
